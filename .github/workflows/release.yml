# Signed, notarised DMG + Sparkle appcast. See docs/release.md.
#
# Triggers:
#   - push a tag `vX.Y.Z`: builds X.Y.Z and publishes a GitHub release with the DMG and appcast.xml
#   - manual run: builds (optionally with a version) and uploads the DMG + appcast as workflow artifacts;
#     tick "publish" to also create the GitHub release.
#
# Required repository secrets:
#   DEVELOPER_ID_P12_BASE64      base64 of the "Developer ID Application" certificate + private key (.p12)
#   DEVELOPER_ID_P12_PASSWORD    password of that .p12
#   KEYCHAIN_PASSWORD            any random string (temporary CI keychain)
#   NOTARY_KEY_ID                App Store Connect API key ID (Developer role or higher)
#   NOTARY_ISSUER_ID             App Store Connect API issuer ID
#   NOTARY_KEY_P8_BASE64         base64 of the API key's AuthKey_<id>.p8
#   SPARKLE_PRIVATE_KEY          Sparkle EdDSA private key (`generate_keys -x key.txt`; the file's contents)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0). Empty: MARKETING_VERSION from project.yml"
        required: false
        default: ""
      notarize:
        description: "Notarise the app and the DMG"
        type: boolean
        default: true
      publish:
        description: "Create a GitHub release (tag v<version>) with the DMG and appcast.xml"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      NOTARY_PROFILE: myscreenart-notary
      MSA_PREVIOUS_APPCAST: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # CFBundleVersion = commit count

      - name: Use the runner's selected Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ -n "$version" ]] || version="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?/\1/p' project.yml | head -1)"
          echo "MSA_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d ' "')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Store notarytool credentials
        if: github.event_name == 'push' || inputs.notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, notarise, DMG, appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARIZE: ${{ github.event_name == 'push' || inputs.notarize }}
        run: |
          args=()
          [[ "$NOTARIZE" == "true" ]] || args+=(--no-notarize)
          scripts/release/release.sh "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: MyScreenArt-${{ steps.version.outputs.version }}
          path: |
            build/release/MyScreenArt-*.dmg
            build/release/appcast.xml
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "MyScreenArt $VERSION" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$tag" "build/release/MyScreenArt-$VERSION.dmg" build/release/appcast.xml --clobber

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
