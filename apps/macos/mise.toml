# Tool versions and developer tasks for the My Screen Cam macOS app (//apps/macos in the monorepo).
# Run `mise install` once here (or `mise run setup` at the repo root). From this directory run `mise run <task>`; from anywhere else
# run `mise //apps/macos:<task>` (`mise tasks ls --all` lists them).

[tools]
"aqua:yonaskolb/XcodeGen" = "2.46.0"

[env]
# Use full Xcode even when xcode-select points at the Command Line Tools. Override by exporting DEVELOPER_DIR.
DEVELOPER_DIR = "{{ get_env(name='DEVELOPER_DIR', default='/Applications/Xcode.app/Contents/Developer') }}"
MSC_DERIVED_DATA = "{{config_root}}/build/DerivedData"
# mlx-swift (speech service) ships a SwiftPM build-tool plugin and swift-syntax macros; command-line xcodebuild
# refuses unvalidated plugins/macros. They come from the pinned, reviewed revisions in Package.resolved.
MSC_XCODEBUILD_TRUST = "-skipPackagePluginValidation -skipMacroValidation"

[tasks.generate]
description = "Generate MyScreenCam.xcodeproj from project.yml"
run = "xcodegen generate --quiet"

[tasks.build]
description = "Build the Debug app (signed with the Apple Development identity)"
depends = ["generate"]
run = "scripts/dev/xcodebuild.sh -project MyScreenCam.xcodeproj -scheme MyScreenCam -configuration Debug -derivedDataPath \"$MSC_DERIVED_DATA\" -destination 'platform=macOS,arch=arm64' $MSC_XCODEBUILD_TRUST -quiet build"

[tasks."build:unsigned"]
description = "Build the Debug app without code signing; separate DerivedData so it never replaces the signed dev app"
depends = ["generate"]
run = "scripts/dev/xcodebuild.sh -project MyScreenCam.xcodeproj -scheme MyScreenCam -configuration Debug -derivedDataPath \"$MSC_DERIVED_DATA-unsigned\" -destination 'platform=macOS,arch=arm64' $MSC_XCODEBUILD_TRUST -quiet CODE_SIGNING_ALLOWED=NO build"

[tasks."build:perf"]
description = "Build the Dev app (same bundle ID/signing/TCC grants) with full optimisation, for perf measurements"
depends = ["generate"]
run = "scripts/dev/xcodebuild.sh -project MyScreenCam.xcodeproj -scheme MyScreenCam -configuration Debug -derivedDataPath \"$MSC_DERIVED_DATA\" -destination 'platform=macOS,arch=arm64' $MSC_XCODEBUILD_TRUST -quiet SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule GCC_OPTIMIZATION_LEVEL=s ENABLE_TESTABILITY=NO build"

[tasks.run]
description = "Build and launch this worktree's Debug app via LaunchServices"
depends = ["build"]
run = "scripts/dev/run.sh"

[tasks.test]
description = "Run the engine package tests"
run = "swift test --package-path Packages/MyScreenCamKit"

[tasks."test:speech-engines"]
description = "Run speech worker path and token-mapping tests"
run = "swift test --package-path Packages/SpeechEngines --filter InferenceEngineTests"

[tasks."test:scripts"]
description = "Check Dev launch and release paths without side effects"
run = "bash scripts/test-scripts.sh"

[tasks."test:app"]
description = "Run app-target state and lifecycle tests"
depends = ["build"]
run = "scripts/dev/xcodebuild.sh -project MyScreenCam.xcodeproj -scheme MyScreenCam -configuration Debug -derivedDataPath \"$MSC_DERIVED_DATA\" -destination 'platform=macOS,arch=arm64' $MSC_XCODEBUILD_TRUST -quiet test"

[tasks.format]
description = "Format Swift sources in place"
run = "xcrun swift-format format --in-place --recursive --parallel App Packages QuickLookThumbnail"

[tasks.lint]
description = "Check Swift formatting and lint rules"
run = "xcrun swift-format lint --strict --recursive --parallel App Packages QuickLookThumbnail"

[tasks.doctor]
description = "Report toolchain, signing and build diagnostics"
run = "scripts/dev/doctor.sh"

[tasks."perf:sample"]
description = "Sample CPU and memory of a process tree (see scripts/perf/sample.py --help)"
run = "python3 scripts/perf/sample.py"

[tasks.release]
description = "Archive, notarise, DMG, notarise DMG and refresh the Sparkle appcast, locally (see docs/release.md)"
run = "scripts/release/release.sh"

[tasks."release:version"]
description = "Set the app version, commit and push it: `mise run release:version -- v1.2.3`"
run = "scripts/release/set-version.sh"

[tasks."release:publish"]
description = "Full local release, then upload DMG + appcast as a GitHub Release of arkaydeus/myscreencam"
run = "scripts/release/release.sh --publish"

[tasks."release:dmg"]
description = "Local Developer ID build + signed DMG, without notarisation or appcast"
run = "scripts/release/release.sh --no-notarize --no-appcast"

[tasks.install]
description = "Build the Developer ID Release app (no notarisation or DMG) and install it to /Applications"
run = "scripts/release/install.sh"

[tasks.check]
description = "Local gate before pushing (there is no GitHub CI): lint, engine tests, signed Debug build"
depends = ["lint", "test", "test:app", "test:speech-engines", "test:scripts"]
run = "echo 'All checks passed.'"

[tasks.clean]
description = "Remove build artifacts and the generated project"
run = ["rm -rf build MyScreenCam.xcodeproj Packages/MyScreenCamKit/.build", "scripts/dev/unregister-builds.sh"]

[tasks.unregister]
description = "Unregister stale My Screen Cam builds (from every worktree) from LaunchServices and Login Items & Extensions"
run = "scripts/dev/unregister-builds.sh"
