# XcodeGen spec. The .xcodeproj is generated (`mise run generate`) and not committed.
name: MyScreenCam

options:
  bundleIdPrefix: com.myscreencam
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: QWD87G9T3P
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    # Sparkle EdDSA public key (base64, from `generate_keys`; see docs/release.md). Until it's set the app
    # doesn't start its updater and "Check for Updates…" stays disabled.
    SPARKLE_PUBLIC_ED_KEY: "SFrWmZbsFPcOp0DLhXi0inL1895NkukUehmnXjIez9E="
  configs:
    Debug:
      # A stable identity + bundle ID keeps TCC grants across rebuilds and worktrees.
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # Apple silicon only (see README); also keeps Float16 and other arm64-only APIs available.
      ARCHS: arm64

packages:
  MyScreenCamKit:
    path: Packages/MyScreenCamKit
  # Speech recognisers (FluidAudio, MLX Audio Swift); linked only by the MyScreenCamSpeech XPC service.
  SpeechEngines:
    path: Packages/SpeechEngines
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.7.0

targets:
  MyScreenCam:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MyScreenCamKit
        product: MyScreenCamCore
      - package: MyScreenCamKit
        product: ProjectKit
      - package: MyScreenCamKit
        product: CaptureKit
      - package: MyScreenCamKit
        product: RecordingKit
      - package: MyScreenCamKit
        product: RenderKit
      - package: MyScreenCamKit
        product: ExportKit
      - package: MyScreenCamKit
        product: SpeechCore
      - package: Sparkle
        product: Sparkle
      - target: MyScreenCamThumbnail
        embed: true
        codeSign: true
      - target: MyScreenCamSpeech
        embed: true
        codeSign: true
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MyScreenCam.entitlements
        # PRODUCT_NAME has spaces ("My Screen Cam"); keep one Swift module name for both configs (tests import it).
        PRODUCT_MODULE_NAME: MyScreenCam
        # Icon Composer file (App/Resources/AppIcon.icon); actool also emits the pre-Tahoe AppIcon.icns.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_NAME: My Screen Cam Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app.dev
          MSC_URL_SCHEME: myscreencam-dev
          MSC_SPARKLE_AUTOMATIC_CHECKS: "NO"
        Release:
          PRODUCT_NAME: My Screen Cam
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app
          MSC_URL_SCHEME: myscreencam
          MSC_SPARKLE_AUTOMATIC_CHECKS: "YES"

  # Finder / Quick Look thumbnails for .mscam packages. Embedded in the app's PlugIns folder and signed
  # with the same identity as the app in each configuration.
  MyScreenCamThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - QuickLookThumbnail
    dependencies:
      - package: MyScreenCamKit
        product: ProjectKit
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        INFOPLIST_FILE: QuickLookThumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickLookThumbnail/QuickLookThumbnail.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
        # One product name for both configs: the app's embed phase references the .appex by name.
        PRODUCT_NAME: MyScreenCamThumbnail
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app.dev.thumbnail
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app.thumbnail

  # On-device speech recognition (Parakeet Ultra via Core ML, Qwen via MLX). Embedded in Contents/XPCServices,
  # started on demand by the app, and exits when the app lets go of it, returning all model memory. See
  # docs/subtitles-plan.md and docs/speech-integration.md.
  MyScreenCamSpeech:
    type: xpc-service
    platform: macOS
    sources:
      - SpeechService
    dependencies:
      - package: MyScreenCamKit
        product: MyScreenCamCore
      - package: MyScreenCamKit
        product: SpeechCore
      - package: SpeechEngines
        product: SpeechEngines
    settings:
      base:
        INFOPLIST_FILE: SpeechService/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpeechService/SpeechService.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
        # One product name for both configs: the app's embed phase references the .xpc by name.
        PRODUCT_NAME: MyScreenCamSpeech
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app.dev.speech
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app.speech
          ARCHS: arm64

  MyScreenCamAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: MyScreenCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.myscreencam.app.dev.tests
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: QWD87G9T3P
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/My Screen Cam Dev.app/Contents/MacOS/My Screen Cam Dev"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  MyScreenCam:
    build:
      targets:
        MyScreenCam: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - MyScreenCamAppTests
