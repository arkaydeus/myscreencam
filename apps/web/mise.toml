# Tasks for the My Screen Cam marketing site (//apps/web in the monorepo): Next.js, Tailwind, shadcn/ui, bun, oxc.
# bun and node are pinned in the root mise.toml. From this directory run `mise run <task>`; from anywhere
# else run `mise //apps/web:<task>`.

[tasks.install]
description = "Install bun workspace dependencies"
run = "bun install"

[tasks.dev]
description = "Start the Next.js dev server (http://localhost:3000)"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Production build"
depends = ["install"]
run = "bun run build"

[tasks.start]
description = "Serve the production build"
depends = ["build"]
run = "bun run start"

[tasks.lint]
description = "Lint with oxlint (warnings fail)"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format with oxfmt in place"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting with oxfmt"
depends = ["install"]
run = "bun run format:check"

[tasks.typecheck]
description = "Type-check with tsc"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Verify hero runtime, narration and download contracts"
depends = ["install"]
run = "bun run test"

[tasks."test:browser"]
description = "Verify illustration bounds and both hero cycles in Chromium (install with mise exec -- bunx playwright install chromium)"
depends = ["build"]
run = "bun run test:browser"

[tasks.check]
description = "Local gate: formatting, lint, types, runtime tests and production browser checks"
depends = ["format:check", "lint", "typecheck", "test", "test:browser"]
run = "echo 'Web checks passed.'"

[tasks.clean]
description = "Remove the Next.js build output"
run = "rm -rf .next"
