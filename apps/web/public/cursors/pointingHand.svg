<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pointing hand cursor - link/button hover style -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Black outline: index finger, folded fingers, palm (square-topped so the fingers meet it cleanly) and thumb, stroked so the overlaps merge -->
    <g fill="black" stroke="black" stroke-width="3" stroke-linejoin="round">
      <rect x="13" y="2" width="3.5" height="17" rx="1.75"/>
      <rect x="16.5" y="11" width="3.5" height="8" rx="1.75"/>
      <rect x="20" y="12" width="3.5" height="8" rx="1.75"/>
      <rect x="23.5" y="13.5" width="3" height="7" rx="1.5"/>
      <rect x="11" y="15" width="15.5" height="13" rx="5"/>
      <rect x="11" y="15" width="15.5" height="7" rx="1.75"/>
      <rect x="7" y="16" width="8" height="3.5" rx="1.75" transform="rotate(40 11 17.75)"/>
    </g>
    <!-- White fill: the same shapes -->
    <g fill="white">
      <rect x="13" y="2" width="3.5" height="17" rx="1.75"/>
      <rect x="16.5" y="11" width="3.5" height="8" rx="1.75"/>
      <rect x="20" y="12" width="3.5" height="8" rx="1.75"/>
      <rect x="23.5" y="13.5" width="3" height="7" rx="1.5"/>
      <rect x="11" y="15" width="15.5" height="13" rx="5"/>
      <rect x="11" y="15" width="15.5" height="7" rx="1.75"/>
      <rect x="7" y="16" width="8" height="3.5" rx="1.75" transform="rotate(40 11 17.75)"/>
    </g>
    <!-- Creases between the folded fingers -->
    <path d="M16.5 13.5 V17 M20 14.5 V17.5 M23.5 15.5 V18" fill="none" stroke="black" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
