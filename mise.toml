# My Screen Cam monorepo root. Each project under apps/ has its own mise.toml with its tools and tasks.
#   mise run setup                 # once: installs every project's tools and the bun workspace
#   mise //apps/macos:<task>       # macOS app (build, run, test, lint, release, ...)
#   mise //apps/web:<task>         # marketing site (dev, build, lint, format, ...)
#   mise run app                   # build and launch the Dev app
#   mise run install:app           # build the Release app and install it to /Applications
#   mise run web                   # the site's dev server
#   mise run start                 # both of the above
#   mise run check                 # every project's local gate
# build, test, lint, format and clean at the root run that task in both projects.
# Inside a project directory, `mise run <task>` resolves to that project's tasks.
monorepo_root = true

[monorepo]
config_roots = ["apps/macos", "apps/web"]

[tools]
# JavaScript toolchain for the bun workspace (apps/web).
bun = "1.4.2"
node = "24.21.0"

[tasks.setup]
description = "Install every project's tools (a plain `mise install` here only covers the root) and the bun workspace"
run = ["mise install", "mise -C apps/macos install", "mise -C apps/web install", "bun install"]

[tasks.install]
description = "Install bun workspace dependencies"
run = "bun install"

[tasks.start]
description = "Build and launch the Dev app, and run the site's dev server"
depends = ["//apps/macos:run", "//apps/web:dev"]

[tasks.app]
description = "Build and launch this worktree's Debug app (same as //apps/macos:run)"
depends = ["//apps/macos:run"]

[tasks."install:app"]
description = "Build the Release app and install it to /Applications (same as //apps/macos:install)"
depends = ["//apps/macos:install"]

[tasks.web]
description = "Start the site's Next.js dev server (same as //apps/web:dev)"
depends = ["//apps/web:dev"]

[tasks.build]
description = "Build every project: the signed Debug app and the production site"
depends = ["//apps/macos:build", "//apps/web:build"]

[tasks.test]
description = "Run every project's tests"
depends = ["//apps/macos:test", "//apps/web:test"]

[tasks.lint]
description = "Lint every project"
depends = ["//apps/macos:lint", "//apps/web:lint"]

[tasks.format]
description = "Format every project in place"
depends = ["//apps/macos:format", "//apps/web:format"]

[tasks.clean]
description = "Remove every project's build output"
depends = ["//apps/macos:clean", "//apps/web:clean"]

[tasks.check]
description = "Local gate before pushing (there is no GitHub CI): every project's check"
depends = ["//apps/macos:check", "//apps/web:check"]
run = "echo 'All projects passed.'"
