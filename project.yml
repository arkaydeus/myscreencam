# XcodeGen spec. The .xcodeproj is generated (`mise run generate`) and not committed.
name: MyScreenArt

options:
  bundleIdPrefix: com.myscreenart
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: QWD87G9T3P
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      # A stable identity + bundle ID keeps TCC grants across rebuilds and worktrees.
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"

packages:
  MyScreenArtKit:
    path: Packages/MyScreenArtKit

targets:
  MyScreenArt:
    type: application
    platform: macOS
    sources:
      - App/Sources
    dependencies:
      - package: MyScreenArtKit
        product: MyScreenArtCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MyScreenArt.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_NAME: MyScreenArt Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreenart.app.dev
          MSA_URL_SCHEME: myscreenart-dev
        Release:
          PRODUCT_NAME: MyScreenArt
          PRODUCT_BUNDLE_IDENTIFIER: com.myscreenart.app
          MSA_URL_SCHEME: myscreenart

schemes:
  MyScreenArt:
    build:
      targets:
        MyScreenArt: all
    run:
      config: Debug
    archive:
      config: Release
